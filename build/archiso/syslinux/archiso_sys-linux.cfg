LABEL arch
TEXT HELP
Boot Toccata OS 1.0 sovereign desktop live session.
Combines pearOS Cupertino design, Zorin OS workflows, and GNOME 47.
ENDTEXT
MENU LABEL Boot Toccata OS 1.0 (Live Session, %ARCH%)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot Toccata OS 1.0 with screen reader speech feedback.
ENDTEXT
MENU LABEL Boot Toccata OS 1.0 (%ARCH%) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
