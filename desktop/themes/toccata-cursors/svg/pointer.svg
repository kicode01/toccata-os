    <path d="M 8.5 2 C 7.4 2 6.5 2.9 6.5 4 L 6.5 13.5 C 5.8 13.1 4.8 13.1 4.1 13.8 C 3.2 14.7 3.2 16.1 4.1 17 C 5.2 18.1 7.2 20.2 8.4 21.6 C 10 23.5 12 25 15.5 25 C 20.5 25 22.5 22.2 22.5 17.5 L 22.5 13 C 22.5 11.9 21.6 11 20.5 11 C 20.1 11 19.8 11.1 19.5 11.3 C 19.2 10.5 18.4 10 17.5 10 C 17.1 10 16.8 10.1 16.5 10.3 C 16.1 9.5 15.2 9 14.2 9 C 13.8 9 13.5 9.1 13.2 9.3 L 13.2 4 C 13.2 2.9 12.3 2 11.2 2 L 8.5 2 Z"
          fill="#0c101d"
          stroke="#0c101d"
          stroke-width="1.8"
          stroke-linejoin="round" />

    <!-- Pure Porcelain Hand Fill -->
    <path d="M 8.5 2 C 7.4 2 6.5 2.9 6.5 4 L 6.5 13.5 C 5.8 13.1 4.8 13.1 4.1 13.8 C 3.2 14.7 3.2 16.1 4.1 17 C 5.2 18.1 7.2 20.2 8.4 21.6 C 10 23.5 12 25 15.5 25 C 20.5 25 22.5 22.2 22.5 17.5 L 22.5 13 C 22.5 11.9 21.6 11 20.5 11 C 20.1 11 19.8 11.1 19.5 11.3 C 19.2 10.5 18.4 10 17.5 10 C 17.1 10 16.8 10.1 16.5 10.3 C 16.1 9.5 15.2 9 14.2 9 C 13.8 9 13.5 9.1 13.2 9.3 L 13.2 4 C 13.2 2.9 12.3 2 11.2 2 L 8.5 2 Z"
          fill="url(#pointer-fill)" />

    <!-- Toccata Signature Touch Resonance Node (at index tip) -->
    <circle cx="9.8" cy="5.5" r="1.3" fill="url(#pointer-accent)" />
  </g>
