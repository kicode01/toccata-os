<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Toccata OS</title>
  <defs>
    <radialGradient id="toccata-obsidian" cx="50%" cy="22%" r="80%">
      <stop offset="0%" stop-color="#1C1C1E"/>
      <stop offset="55%" stop-color="#0C0C0E"/>
      <stop offset="100%" stop-color="#040405"/>
    </radialGradient>
    <radialGradient id="toccata-halo" cx="50%" cy="52%" r="48%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.24"/>
      <stop offset="52%" stop-color="#FFFFFF" stop-opacity="0.07"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Pure Apple Space-Black Squircle Tile -->
  <rect id="toccata-tile" x="16" y="16" width="224" height="224" rx="52" fill="url(#toccata-obsidian)"/>
  <!-- Subtle Specular Glass Rim -->
  <rect x="17.5" y="17.5" width="221" height="221" rx="50.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
  <!-- Soft Neutral White Backlight Halo -->
  <circle id="toccata-glow-halo" cx="128" cy="131" r="92" fill="url(#toccata-halo)"/>
  <!-- Pure Monolithic Silhouette (Top T-Bar + Tuning Fork U) -->
  <path id="toccata-t-bar" fill="#FFFFFF" d="M 64 56 H 192 A 15 15 0 0 1 207 71 V 73 A 15 15 0 0 1 192 88 H 64 A 15 15 0 0 1 49 73 V 71 A 15 15 0 0 1 64 56 Z"/>
  <path id="toccata-fork-u" fill="#FFFFFF" d="M 83 106 A 15 15 0 0 1 98 121 V 136 A 30 30 0 0 0 158 136 V 121 A 15 15 0 0 1 188 121 V 136 A 60 60 0 0 1 143 194.1 V 206 A 15 15 0 0 1 113 206 V 194.1 A 60 60 0 0 1 68 136 V 121 A 15 15 0 0 1 83 106 Z"/>
</svg>
