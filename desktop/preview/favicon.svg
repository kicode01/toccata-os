<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">Toccata OS — Resonant Squircle Icon</title>
  <g id="toccata-logo-root">
    <!-- Layer 1: Squircle OS Tile (224x224, rx=52) -->
    <rect id="toccata-tile" x="16" y="16" width="224" height="224" rx="52" fill="#007AFF"/>
    <!-- Layer 2: Parallel Vertical Harmonic Bars (w=18, rx=9, gap=16 from U-prongs, outer x=46..210) -->
    <g id="toccata-waves" fill="#38BDF8">
      <rect id="toccata-wave-left" x="46" y="96" width="18" height="44" rx="9"/>
      <rect id="toccata-wave-right" x="192" y="96" width="18" height="44" rx="9"/>
    </g>
    <!-- Layer 3: Geometric 'T' Top Bar (w=164, h=30, rx=15, x=46..210 — exact alignment with outer bars) -->
    <rect id="toccata-t-bar" x="46" y="48" width="164" height="30" rx="15" fill="#FFFFFF"/>
    <!-- Layer 4: Tuning Fork U-Resonator + Stem (w=28, r_outer=48, r_inner=20, x=80..176) -->
    <path id="toccata-fork-u" fill="#FFFFFF" d="M 94 96 A 14 14 0 0 1 108 110 V 132 A 20 20 0 0 0 148 132 V 110 A 14 14 0 0 1 176 110 V 132 A 48 48 0 0 1 142 177.9 V 202 A 14 14 0 0 1 114 202 V 177.9 A 48 48 0 0 1 80 132 V 110 A 14 14 0 0 1 94 96 Z"/>
    <!-- Layer 5: Central Harmonic Core Pill (w=18, rx=9, gap=11 inside U-channel) -->
    <rect id="toccata-core-pulse" x="119" y="96" width="18" height="36" rx="9" fill="#38BDF8"/>
  </g>
</svg>
