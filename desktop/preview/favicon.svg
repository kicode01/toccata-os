<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="toccata-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="48%" stop-color="#007aff"/>
      <stop offset="100%" stop-color="#5856d6"/>
    </linearGradient>
    <linearGradient id="toccata-fork" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0f2fe"/>
    </linearGradient>
    <filter id="fork-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#001d3d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Squircle Emblem Base -->
  <rect x="6" y="6" width="108" height="108" rx="26" fill="url(#toccata-bg)"/>
  <rect x="7" y="7" width="106" height="106" rx="25" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>

  <!-- Outer Harmonic Resonance Arcs -->
  <path d="M22 30 A34 34 0 0 0 22 66" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round"/>
  <path d="M98 30 A34 34 0 0 1 98 66" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="4" stroke-linecap="round"/>

  <!-- Inner Harmonic Resonance Arcs -->
  <path d="M30 36 A22 22 0 0 0 30 60" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="4" stroke-linecap="round"/>
  <path d="M90 36 A22 22 0 0 1 90 60" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="4" stroke-linecap="round"/>

  <!-- Geometric 'T' + Tuning Fork Prongs & Stem -->
  <g filter="url(#fork-glow)">
    <!-- Top 'T' Crossbar Wing -->
    <rect x="34" y="24" width="52" height="9" rx="4.5" fill="url(#toccata-fork)"/>
    <!-- Tuning Fork U-Prongs + Central Stem -->
    <path d="M43 28 V52 C43 62 50.5 68 60 68 C69.5 68 77 62 77 52 V28" fill="none" stroke="url(#toccata-fork)" stroke-width="8.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Lower Resonator Stem -->
    <line x1="60" y1="68" x2="60" y2="94" stroke="url(#toccata-fork)" stroke-width="8.5" stroke-linecap="round"/>
    <!-- Acoustic Node Point -->
    <circle cx="60" cy="94" r="5.5" fill="#38bdf8" stroke="#ffffff" stroke-width="2.5"/>
  </g>
</svg>
