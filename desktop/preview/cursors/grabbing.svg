    <path d="M 10 9 C 9 9 8 10 8 11.5 L 8 16 C 8 18 9 20 11 22 C 13 24 15 25 18 25 C 22 25 24 22 24 18 L 24 14 C 24 12.5 23 11.5 21.5 11.5 C 20.8 11.5 20.2 11.8 19.8 12.3 C 19.4 11.2 18.2 10.5 17 10.5 C 16.5 10.5 16 10.7 15.6 11 C 15.2 10 14.2 9.3 13 9.3 C 12.5 9.3 12 9.5 11.6 9.8 C 11.2 9.3 10.6 9 10 9 Z"
