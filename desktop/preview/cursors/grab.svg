  </defs>

  <g filter="url(#hand-shadow)">
    <!-- Obsidian Contour -->
    <path d="M 12 5 C 10.8 5 10 5.9 10 7.1 L 10 14 C 9.2 13.5 8 13.5 7.2 14.3 C 6.4 15.1 6.4 16.3 7.2 17.1 L 10 20 C 11.5 22.5 13.5 25 17 25 C 21.5 25 24 22 24 18 L 24 12 C 24 10.9 23.1 10 22 10 C 21.6 10 21.2 10.1 20.9 10.4 C 20.5 9.5 19.6 9 18.5 9 C 18.1 9 17.8 9.1 17.4 9.3 C 17 8.5 16.1 8 15 8 C 14.6 8 14.3 8.1 14 8.3 L 14 7.1 C 14 5.9 13.2 5 12 5 Z"
          fill="#0c101d"
          stroke="#0c101d"
          stroke-width="1.8"
          stroke-linejoin="round" />

    <!-- Pure Porcelain Open Hand Fill -->
    <path d="M 12 5 C 10.8 5 10 5.9 10 7.1 L 10 14 C 9.2 13.5 8 13.5 7.2 14.3 C 6.4 15.1 6.4 16.3 7.2 17.1 L 10 20 C 11.5 22.5 13.5 25 17 25 C 21.5 25 24 22 24 18 L 24 12 C 24 10.9 23.1 10 22 10 C 21.6 10 21.2 10.1 20.9 10.4 C 20.5 9.5 19.6 9 18.5 9 C 18.1 9 17.8 9.1 17.4 9.3 C 17 8.5 16.1 8 15 8 C 14.6 8 14.3 8.1 14 8.3 L 14 7.1 C 14 5.9 13.2 5 12 5 Z"
          fill="url(#hand-grad)" />

    <!-- Palm Micro Accent -->
    <circle cx="16" cy="18" r="1.2" fill="#007aff" />
  </g>
